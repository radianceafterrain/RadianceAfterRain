    <script type="text/javascript">

var colours=new Array("#c55de3", "#e8984e", "#e8984e", "#c55de3", "#1b1927"); // colours for top, right, bottom and left borders and background of bubbles
var bubbles=66; // maximum number of bubbles on screen
var over_or_under="over"; // set to "over" for bubbles to always be on top, or "under" to allow them to float behind other objects

/****************************
* JavaScript Bubble Cursor  *

var x=ox=400;
var y=oy=300;
var swide=800;
var shigh=600;
var sleft=sdown=0;
var bubb=new Array();
var bubbx=new Array();
var bubby=new Array();
var bubbs=new Array();
var sploosh=false;

function addLoadEvent(funky) {
  var oldonload=window.onload;
  if (typeof(oldonload)!='function') window.onload=funky;
  else window.onload=function() {
    if (oldonload) oldonload();
    funky();
  }
}

function buble() { if (document.getElementById) {
  var i, rats, div;
  for (i=0; i<bubbles; i++) {
    rats=createDiv("3px", "3px");
    rats.style.visibility="hidden";
	rats.style.zIndex=(over_or_under=="over")?"1001":"0";
  rats.style.pointerEvents="none";

    div=createDiv("auto", "auto");
    rats.appendChild(div);
    div=div.style;
    div.top="1px";
    div.left="0px";
    div.bottom="1px";
    div.right="0px";
    div.borderLeft="1px solid "+colours[3];
    div.borderRight="1px solid "+colours[1];

    div=createDiv("auto", "auto");
    rats.appendChild(div);
    div=div.style;
    div.top="0px";
    div.left="1px";
    div.right="1px";
    div.bottom="0px"
    div.borderTop="1px solid "+colours[0];
    div.borderBottom="1px solid "+colours[2];

    div=createDiv("auto", "auto");
    rats.appendChild(div);
    div=div.style;
    div.left="1px";
    div.right="1px";
    div.bottom="1px";
    div.top="1px";
    div.backgroundColor=colours[4];
    if (navigator.appName=="Microsoft Internet Explorer") div.filter="alpha(opacity=50)";
    else div.opacity=0.5;
    document.body.appendChild(rats);
    bubb[i]=rats.style;
  }
  set_scroll();
  set_width();
  bubble();
}}

function bubble() {
  var c;
  if (Math.abs(x-ox)>1 || Math.abs(y-oy)>1) {
    ox=x;
    oy=y;
    for (c=0; c<bubbles; c++) if (!bubby[c]) {
      bubb[c].left=(bubbx[c]=x)+"px";
      bubb[c].top=(bubby[c]=y-3)+"px";
      bubb[c].width="3px";
      bubb[c].height="3px"
      bubb[c].visibility="visible";
      bubbs[c]=3;
      break;
    }
  }
  for (c=0; c<bubbles; c++) if (bubby[c]) update_bubb(c);
  setTimeout("bubble()", 40);
}

document.onmousedown=splash;
document.onmouseup=function(){clearTimeout(sploosh);};

function splash() {
  ox=-1;
  oy=-1;
  sploosh=setTimeout('splash()', 100);
}

function update_bubb(i) {
  if (bubby[i]) {
    bubby[i]-=bubbs[i]/2+i%2;
    bubbx[i]+=(i%5-2)/5;
    if (bubby[i]>sdown && bubbx[i]>sleft && bubbx[i]<sleft+swide+bubbs[i]) {
	  if (Math.random()<bubbs[i]/shigh*2 && bubbs[i]++<8) {
		bubb[i].width=bubbs[i]+"px";
		bubb[i].height=bubbs[i]+"px";
	  }
      bubb[i].top=bubby[i]+"px";
      bubb[i].left=bubbx[i]+"px";
    }
    else {
      bubb[i].visibility="hidden";
      bubby[i]=0;
      return;
    }
  }
}

document.onmousemove=mouse;
function mouse(e) {
  if (e) {
    y=e.pageY;
    x=e.pageX;
  }
  else {
    set_scroll();
    y=event.y+sdown;
    x=event.x+sleft;
  }
}

window.onresize=set_width;
function set_width() {
  var sw_min=999999;
  var sh_min=999999;
  if (document.documentElement && document.documentElement.clientWidth) {
    if (document.documentElement.clientWidth>0) sw_min=document.documentElement.clientWidth;
    if (document.documentElement.clientHeight>0) sh_min=document.documentElement.clientHeight;
  }
  if (typeof(self.innerWidth)=='number' && self.innerWidth) {
    if (self.innerWidth>0 && self.innerWidth<sw_min) sw_min=self.innerWidth;
    if (self.innerHeight>0 && self.innerHeight<sh_min) sh_min=self.innerHeight;
  }
  if (document.body.clientWidth) {
    if (document.body.clientWidth>0 && document.body.clientWidth<sw_min) sw_min=document.body.clientWidth;
    if (document.body.clientHeight>0 && document.body.clientHeight<sh_min) sh_min=document.body.clientHeight;
  }
  if (sw_min==999999 || sh_min==999999) {
    sw_min=800;
    sh_min=600;
  }
  swide=sw_min;
  shigh=sh_min;
}

window.onscroll=set_scroll;
function set_scroll() {
  if (typeof(self.pageYOffset)=='number') {
    sdown=self.pageYOffset;
    sleft=self.pageXOffset;
  }
  else if (document.body && (document.body.scrollTop || document.body.scrollLeft)) {
    sdown=document.body.scrollTop;
    sleft=document.body.scrollLeft;
  }
  else if (document.documentElement && (document.documentElement.scrollTop || document.documentElement.scrollLeft)) {
    sleft=document.documentElement.scrollLeft;
    sdown=document.documentElement.scrollTop;
  }
  else {
    sdown=0;
    sleft=0;
  }
}

function createDiv(height, width) {
  var div=document.createElement("div");
  div.style.position="absolute";
  div.style.height=height;
  div.style.width=width;
  div.style.overflow="hidden";
  div.style.backgroundColor="transparent";
  return (div);
}

window.onload = function() {
    buble();
};

<div id="doodle-widget">
  <h2>doodle!</h2>
 
  <canvas id="doodle-canvas" class="content-block"
    style="touch-action:none;background:#000;cursor:crosshair;width:100%;"></canvas>
 
  <div class="content-block doodle-controls">
    <input type="color" id="doodle-color" value="#b00b69">
    <input type="text" id="doodle-hex" value="#b00b69" placeholder="#b00b69">
    <input type="range" id="doodle-size" min="1" max="20" value="1">
    <button id="doodle-clear" type="button" class="text"><h2>clear</h2></button>
    <button id="doodle-send" type="button" class="text1"><h2>send anonymously</h2></button>
  </div>
 
  <h2 id="doodle-status"></h2>
</div>
 
<script>
(function () {
  // ---- CONFIGURE THIS ----
  const FORM_ENDPOINT = "https://api.web3forms.com/submit";
  const WEB3FORMS_ACCESS_KEY = "9d18d101-2fad-41f7-a375-fe4eeb211728";
  // -------------------------
 
  const canvas = document.getElementById('doodle-canvas');
  const ctx = canvas.getContext('2d');
  const colorInput = document.getElementById('doodle-color');
  const hexInput = document.getElementById('doodle-hex');
  const sizeInput = document.getElementById('doodle-size');
 
  const HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
 
  // Color swatch changes -> update the hex text field
  colorInput.addEventListener('input', function () {
    hexInput.value = colorInput.value;
  });
 
  // Typing a hex code -> update the swatch, once it's a valid hex
  hexInput.addEventListener('input', function () {
    let val = hexInput.value.trim();
    if (val && val[0] !== '#') val = '#' + val;
    if (HEX_RE.test(val)) {
      colorInput.value = val.length === 4
        ? '#' + val[1] + val[1] + val[2] + val[2] + val[3] + val[3] // expand shorthand #abc -> #aabbcc
        : val;
    }
  });
 
  // On blur, snap the text field back to whatever the swatch actually holds
  // (cleans up invalid/partial input the user left behind)
  hexInput.addEventListener('blur', function () {
    hexInput.value = colorInput.value;
  });
  const clearBtn = document.getElementById('doodle-clear');
  const sendBtn = document.getElementById('doodle-send');
  const status = document.getElementById('doodle-status');
 
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
 
  let drawing = false;
  let last = null;

  // Undo/redo history — stores full canvas snapshots
  const undoStack = [];
  const redoStack = [];
  const MAX_HISTORY = 50;

  function saveState() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0; // any new action invalidates redo history
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
  }

  saveState(); // blank canvas is the first undo-able state
 
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY
    };
  }
 
  function start(e) {
    saveState();
    drawing = true;
    last = getPos(e);
    e.preventDefault();
  }
 
  function move(e) {
    if (!drawing) return;
    const pos = getPos(e);
    ctx.strokeStyle = colorInput.value;
    ctx.lineWidth = sizeInput.value;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last = pos;
    e.preventDefault();
  }
 
  function end() { drawing = false; }
 
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
 
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
 
  clearBtn.addEventListener('click', function () {
    saveState();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    status.textContent = '';
  });

  document.addEventListener('keydown', function (e) {
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if (!ctrlOrCmd || e.key.toLowerCase() !== 'z') return;
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  });
 
  sendBtn.addEventListener('click', function () {
    canvas.toBlob(async function (blob) {
      if (!blob) return;
      status.textContent = 'Sending…';
      sendBtn.disabled = true;
 
      try {
        // Web3Forms' free plan doesn't support real file attachments, so the
        // doodle is sent as a base64 text string instead of an uploaded file.
        const dataUrl = await new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onload = function () { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
 
        const res = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: 'New anonymous doodle',
            doodle_image: dataUrl
          })
        });
        if (res.ok) {
          status.textContent = 'Sent — thank you!';
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          status.textContent = 'Something went wrong. Try again later.';
        }
      } catch (err) {
        status.textContent = 'Network error. Try again later.';
      } finally {
        sendBtn.disabled = false;
      }
    }, 'image/png');
  });
})();
</script>
