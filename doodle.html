    <meta charset="UTF-8">

    <title>Doodle</title>

</head>
<body>
    <div class="bg1"></div>



<div id="doodle-widget">
  <h2>doodle!</h2>
 
  <canvas id="doodle-canvas" class="content-block"
    style="touch-action:none;background:#000;cursor:crosshair;width:100%;"></canvas>
 
  <div class="content-block doodle-controls">
    <input type="color" id="doodle-color" value="#b00b69">
    <input type="text" id="doodle-hex" value="#b00b69" placeholder="#b00b69">
    <input type="range" id="doodle-size" min="1" max="20" value="1">
    <button id="doodle-undo" type="button" class="text" style="display:none;"><h2>undo</h2></button>
    <button id="doodle-redo" type="button" class="text1" style="display:none;"><h2>redo</h2></button>
    <button id="doodle-clear" type="button" class="text"><h2>clear</h2></button>
    <button id="doodle-send" type="button" class="text1"><h2>send anonymously</h2></button>
  </div>
 
  <h2 id="doodle-status"></h2>
</div>
 
<script>
(function () {
  // ---- CONFIGURE THIS ----
  const FORM_ENDPOINT = "https://api.web3forms.com/submit";
  const WEB3FORMS_ACCESS_KEY = "9d18d101-2fad-41f7-a375-fe4eeb211728";
  // -------------------------
 
  const canvas = document.getElementById('doodle-canvas');
  const ctx = canvas.getContext('2d');
  const colorInput = document.getElementById('doodle-color');
  const hexInput = document.getElementById('doodle-hex');
  const sizeInput = document.getElementById('doodle-size');
 
  const HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
 
  // Color swatch changes -> update the hex text field
  colorInput.addEventListener('input', function () {
    hexInput.value = colorInput.value;
  });
 
  // Typing a hex code -> update the swatch, once it's a valid hex
  hexInput.addEventListener('input', function () {
    let val = hexInput.value.trim();
    if (val && val[0] !== '#') val = '#' + val;
    if (HEX_RE.test(val)) {
      colorInput.value = val.length === 4
        ? '#' + val[1] + val[1] + val[2] + val[2] + val[3] + val[3] // expand shorthand #abc -> #aabbcc
        : val;
    }
  });
 
  // On blur, snap the text field back to whatever the swatch actually holds
  // (cleans up invalid/partial input the user left behind)
  hexInput.addEventListener('blur', function () {
    hexInput.value = colorInput.value;
  });
  const clearBtn = document.getElementById('doodle-clear');
  const sendBtn = document.getElementById('doodle-send');
  const undoBtn = document.getElementById('doodle-undo');
  const redoBtn = document.getElementById('doodle-redo');
  const status = document.getElementById('doodle-status');
 
  let drawing = false;
  let last = null;
  let lastCheckpoint = 0;

  // The canvas has no width/height attributes, so its drawing surface would
  // otherwise default to a blurry 300x150 and get stretched by CSS. This
  // sizes the real pixel resolution to match how big it's actually
  // displayed (and the screen's pixel density), keeping lines crisp.
  function sizeCanvasToDisplay() {
    const rect = canvas.getBoundingClientRect();
    const ratio = Math.min(window.devicePixelRatio || 1, 2); // capped so retina/high-DPI screens don't blow up file size
    const newWidth = Math.max(1, Math.round(rect.width * ratio));
    const newHeight = Math.max(1, Math.round(rect.height * ratio));
    if (canvas.width === newWidth && canvas.height === newHeight) return;

    // preserve whatever's already drawn by copying it onto the resized canvas
    const prev = document.createElement('canvas');
    prev.width = canvas.width;
    prev.height = canvas.height;
    if (canvas.width && canvas.height) prev.getContext('2d').drawImage(canvas, 0, 0);

    canvas.width = newWidth;
    canvas.height = newHeight;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (prev.width && prev.height) {
      ctx.drawImage(prev, 0, 0, prev.width, prev.height, 0, 0, canvas.width, canvas.height);
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // resizing invalidates any saved snapshots (they're a different pixel size)
    undoStack.length = 0;
    redoStack.length = 0;
  }

  // Undo/redo history — stores full canvas snapshots
  const undoStack = [];
  const redoStack = [];
  const MAX_HISTORY = 50;

  function updateUndoRedoButtons() {
    undoBtn.style.display = undoStack.length <= 1 ? 'none' : ''; // first entry is just the blank baseline
    redoBtn.style.display = redoStack.length === 0 ? 'none' : '';
  }

  function saveState() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0; // any new action invalidates redo history
    updateUndoRedoButtons();
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
    updateUndoRedoButtons();
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
    updateUndoRedoButtons();
  }

  sizeCanvasToDisplay();
  saveState(); // blank canvas is the first undo-able state
 
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY
    };
  }
 
  function start(e) {
    saveState();
    lastCheckpoint = performance.now();
    drawing = true;
    last = getPos(e);
    e.preventDefault();
  }
 
  function move(e) {
    if (!drawing) return;
    // add extra undo checkpoints during a long continuous stroke, not just
    // one at the very start of it, so dragging for a while still gives you
    // more than a single undo step
    const now = performance.now();
    if (now - lastCheckpoint > 400) {
      saveState();
      lastCheckpoint = now;
    }
    const pos = getPos(e);
    ctx.strokeStyle = colorInput.value;
    ctx.lineWidth = sizeInput.value;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last = pos;
    e.preventDefault();
  }
 
  function end() { drawing = false; }
 
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
 
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
 
  clearBtn.addEventListener('click', function () {
    saveState();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    status.textContent = '';
  });

  document.addEventListener('keydown', function (e) {
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if (!ctrlOrCmd || e.key.toLowerCase() !== 'z') return;
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  });

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  let resizeTimeout = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function () {
      sizeCanvasToDisplay();
      saveState();
    }, 150);
  });
 
  sendBtn.addEventListener('click', function () {
    canvas.toBlob(async function (blob) {
      if (!blob) return;
      status.textContent = 'Sending…';
      sendBtn.disabled = true;
 
      try {
        // Web3Forms' free plan doesn't support real file attachments, so the
        // doodle is sent as a base64 text string instead of an uploaded file.
        const dataUrl = await new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onload = function () { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
 
        const res = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: 'New anonymous doodle',
            doodle_image: dataUrl
          })
        });
        if (res.ok) {
          status.textContent = 'Sent — thank you!';
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          status.textContent = 'Something went wrong. Try again later.';
        }
      } catch (err) {
        status.textContent = 'Network error. Try again later.';
      } finally {
        sendBtn.disabled = false;
      }
    }, 'image/png');
  });
})();
</script>
