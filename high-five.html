<body>

<div class="bg1"></div>
<div> <h2> up top! </h2>
  <img class="img-starhover" src="hi5.png" style="cursor:pointer" onclick="playRandom(); doShake(this); boop()">
  <h2><span id="count">0</span> high fives</h2>
  </div>
  <audio id="mySound"></audio>

<script>
  const sounds = [
    "johnny-test-whip-crack.mp3",
    "roblox-explosion-sound.mp3",
    "https://files.catbox.moe/v4efou.mp3",
  ];

  const audioEl = document.getElementById('mySound');

  function playRandom() {
    audioEl.src = sounds[Math.floor(Math.random() * sounds.length)];
    audioEl.playbackRate = 0.5 + Math.random() * 1.5;
    audioEl.currentTime = 0;
    audioEl.play();
  }
  
  function doShake(el) {
  el.classList.add('shake');
  el.addEventListener('animationend', () => {
    el.classList.remove('shake');
  }, { once: true });
}

const display = document.getElementById('count');
  let clicks = parseInt(localStorage.getItem('imgClicks') || '0');
  display.textContent = clicks;

  function boop() {
    clicks++;
    localStorage.setItem('imgClicks', clicks);
    display.textContent = clicks;
  }
</script>
